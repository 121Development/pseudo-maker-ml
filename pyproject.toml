[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudo-maker"
version = "0.1.0"
description = "Anonymize Swedish/English PII in documents for safe LLM use, then restore. KB-BERT + Rampart NER with rule-based fallback."
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1.0",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface_hub>=0.20",
  "numpy>=1.24",
  "Faker>=24.0",
  "python-stdnum>=1.20",
  "rapidfuzz>=3.6",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Fallback NER when the KB-BERT model is not installed; also assists on English text.
spacy = [
  "spacy>=3.7,<4.0",
]
# Build-time only: export KB-BERT to ONNX (`pseudo-maker fetch-models`).
export = [
  "torch>=2.2",
  "transformers>=4.40",
  "onnx>=1.15",
  "onnxscript>=0.1",
]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.5",
]

[project.scripts]
pseudo-maker = "pseudo_maker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pseudo_maker.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
